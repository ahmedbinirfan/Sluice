apiVersion: v1
kind: ConfigMap
metadata:
  name: sluice-umbrella-status
  labels:
    app.kubernetes.io/name: sluice
    app.kubernetes.io/part-of: sluice
data:
  vllm: {{ .Values.vllm.enabled | quote }}
  tei: {{ .Values.tei.enabled | quote }}
  litellm: {{ .Values.litellm.enabled | quote }}
  langfuse: {{ .Values.langfuse.enabled | quote }}
  kube-prometheus-stack: {{ index .Values "kube-prometheus-stack" "enabled" | quote }}
