apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-litellm-db
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: sluice
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: postgres
      protocol: TCP
  selector:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
