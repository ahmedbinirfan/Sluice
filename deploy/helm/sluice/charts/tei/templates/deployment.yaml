{{- range .Values.engines }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-tei-{{ .name }}
  labels:
    app.kubernetes.io/name: tei
    app.kubernetes.io/component: {{ .name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: sluice
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tei
      app.kubernetes.io/component: {{ .name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tei
        app.kubernetes.io/component: {{ .name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/part-of: sluice
    spec:
      containers:
        - name: tei
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - --model-id
            - {{ .model | quote }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: model-cache
              mountPath: {{ $.Values.persistence.mountPath }}
          readinessProbe:
            {{- toYaml $.Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml $.Values.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: {{ $.Release.Name }}-tei-{{ .name }}-cache
{{- end }}
