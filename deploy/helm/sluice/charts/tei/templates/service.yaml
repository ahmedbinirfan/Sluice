{{- range .Values.engines }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-tei-{{ .name }}
  labels:
    app.kubernetes.io/name: tei
    app.kubernetes.io/component: {{ .name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: sluice
spec:
  type: {{ $.Values.service.type }}
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: tei
    app.kubernetes.io/component: {{ .name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
{{- end }}
