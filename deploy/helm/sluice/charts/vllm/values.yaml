# ADR-0004 / SLU-52: Qwen3-8B-AWQ on T4 16GB, dtype float16.
# vllm/vllm-openai entrypoint is `python -m vllm.entrypoints.openai.api_server` (flags, not positional model).
replicaCount: 1

image:
  repository: vllm/vllm-openai
  tag: v0.8.5
  pullPolicy: IfNotPresent

model: Qwen/Qwen3-8B-AWQ

# Serve flags — keep max-model-len in the 4k–8k band so KV fits ~7–8GB (docs/learning/serving.md).
# Thinking-off via --chat-template-kwargs needs a newer vLLM; smoke with defaults for 0.8.5.
extraArgs:
  - --dtype
  - float16
  - --max-model-len
  - "4096"
  - --gpu-memory-utilization
  - "0.90"
  - --host
  - "0.0.0.0"
  - --port
  - "8000"
  # SLU-56: keep concurrent running low so waiting builds under burst.
  - --max-num-seqs
  - "8"

service:
  type: ClusterIP
  port: 8000

persistence:
  size: 20Gi
  storageClassName: managed-csi
  mountPath: /root/.cache/huggingface

resources:
  limits:
    nvidia.com/gpu: "1"

nodeSelector:
  pool: gpu

tolerations:
  - key: nvidia.com/gpu
    operator: Equal
    value: present
    effect: NoSchedule
  - key: kubernetes.azure.com/scalesetpriority
    operator: Equal
    value: spot
    effect: NoSchedule

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 120
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 300
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 5

# SLU-56: KEDA scales the StatefulSet on queue depth (Prometheus scrape of /metrics).
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 2
  pollingInterval: 15
  cooldownPeriod: 180
  threshold: "2"
  prometheusAddress: http://sluice-prometheus.sluice.svc.cluster.local:9090
