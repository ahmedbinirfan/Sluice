# Slim Argo CD for a 1-node Free-tier AKS system pool (chart 10.x).
configs:
  params:
    server.insecure: true

server:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

applicationSet:
  enabled: false

notifications:
  enabled: false

dex:
  enabled: false

redis:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
